[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclipper"
version = "1.0.0"
description = "Gera clipes automáticos de lives da Twitch e do YouTube detectando risadas, gritos, explosões e picos no chat."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AlessandroDz" }]
keywords = ["twitch", "youtube", "clips", "live", "ffmpeg", "yamnet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "streamlink",
    "yt-dlp",
    "numpy",
    "tensorflow",
    "tensorflow-hub",
    "setuptools<81",  # tensorflow-hub ainda usa pkg_resources
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
autoclipper = "autoclipper.__main__:main"

[project.urls]
Repository = "https://github.com/AlessandroDz/autoclipper_v1"

# ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["buffer", "videos"]

[tool.ruff.lint]
# E/W: estilo (pycodestyle) | F: erros (pyflakes) | I: ordem dos imports
# B: bugs comuns (bugbear) | UP: sintaxe moderna | SIM: simplificações
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E402",    # __main__.py configura o TensorFlow antes dos imports de propósito
    "SIM105",  # try/except/pass é mais legível que contextlib.suppress aqui
]

[tool.ruff.format]
quote-style = "double"
